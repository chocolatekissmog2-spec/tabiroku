<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅ログ｜日本めぐりチェック</title>
<meta name="theme-color" content="#c8453b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅ログ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{
  --bg:#faf7f2;--card:#fff;--tx:#2b2a28;--sub:#7a746b;--line:#e8e1d6;
  --ac:#c8453b;--ac2:#fbe9e6;--ok:#2f8f5b;--ok2:#e5f4ec;--dis:#b9852a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1b19;--card:#262522;--tx:#efece6;--sub:#a39d92;--line:#3a3834;--ac:#e8685d;--ac2:#3a2522;--ok:#4bbf80;--ok2:#1f3328;--dis:#e0b155}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 0;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:18px;margin:0;flex:1}
.total{font-size:13px;color:var(--sub)}
.total b{color:var(--ac);font-size:16px}
.menu{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;width:38px;height:38px;font-size:18px}
.gbar{height:5px;background:var(--line);border-radius:3px;margin:8px 0 0;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;border:0;background:none;color:var(--sub);padding:10px 4px;font-size:14px;font-weight:600;border-bottom:3px solid transparent}
.tab.on{color:var(--ac);border-color:var(--ac)}
main{max-width:720px;margin:0 auto;padding:0 12px 80px}
.bar-f{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}
.bar-f input[type=search]{flex:1 1 100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
h2.rg{font-size:13px;color:var(--sub);margin:18px 4px 6px;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.card.done{border-color:var(--ok)}
.hd{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--tx);padding:13px 14px;font-size:16px;text-align:left}
.hd .pn{font-weight:700;flex:0 1 auto}
.hd .cnt{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.card.done .cnt{color:var(--ok);font-weight:700}
.hd .bar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;min-width:30px}
.hd .bar i{display:block;height:100%;background:var(--ok);width:0}
.hd .car{color:var(--sub);transition:transform .2s}
.card.open .car{transform:rotate(180deg)}
.bd{display:none;padding:0 6px 10px;border-top:1px solid var(--line)}
.card.open .bd{display:block}
.gh{font-size:13px;color:var(--sub);margin:12px 8px 2px;font-weight:600}
.empty,.note{font-size:13px;color:var(--sub);margin:10px 8px}
.row{display:flex;flex-wrap:wrap;align-items:center;padding:2px 4px;border-radius:10px}
.row .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:9px 6px;cursor:pointer}
.chk{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;background:var(--card);transition:.15s}
.row.on .chk{background:var(--ok);border-color:var(--ok)}
.row.on .chk::after{content:"✓";color:#fff;font-weight:800;font-size:17px;line-height:1}
.row.on .nm{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--line)}
.tx{min-width:0}
.nm{font-size:16px}
.pf{font-size:13px;color:var(--sub);margin-left:2px;text-decoration:none;display:inline-block}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tags:empty{display:none}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;background:var(--ac2);color:var(--ac)}
.tag.pl{background:var(--line);color:var(--sub)}
.tag.dis{background:none;border:1px dashed var(--dis);color:var(--dis)}
.row.dis .chk{border-style:dashed;border-color:var(--dis)}
.row.dis.on .chk{border-style:solid;background:var(--dis);border-color:var(--dis)}
.sub{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.ic{flex:none;width:38px;height:38px;display:grid;place-items:center;border:0;background:none;color:var(--sub);font-size:17px;text-decoration:none;border-radius:10px}
.ic:active{background:var(--line)}
.memo{flex:1 1 100%;padding:2px 8px 10px 52px;display:flex;flex-direction:column;gap:6px}
.memo[hidden]{display:none}
.memo label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:8px}
.memo input,.memo textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--tx)}
.memo textarea{width:100%;resize:vertical}
.sep{font-size:12px;color:var(--dis);margin:10px 10px 2px}
.sandai-note{font-size:12px;color:var(--sub);margin:8px 12px 0}
.p-sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.p-sec h3{margin:0 0 10px;font-size:14px}
.p-line{display:flex;align-items:center;gap:10px;font-size:14px;margin:7px 0}
.p-line .l{flex:0 0 7.5em}
.p-line .b{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.p-line .b i{display:block;height:100%;background:var(--ok)}
.p-line .v{flex:0 0 3.6em;text-align:right;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.big{font-size:34px;font-weight:800;color:var(--ac)}
#warn{background:#fff3cd;color:#664d03;font-size:13px;padding:8px 12px;border-radius:10px;margin-top:10px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);width:min(92vw,400px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 6px}
dialog p{font-size:13px;color:var(--sub);margin:4px 0 12px}
.btn{display:block;width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px}
dialog input[type=url],dialog input[type=password]{display:block;width:100%;padding:11px;margin:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:14px}
dialog input[type=text],dialog select{display:block;width:100%;padding:11px;margin:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:14px}
.crow{display:flex;align-items:center;gap:8px;font-size:14px;padding:7px 2px;border-bottom:1px solid var(--line)}
.crow .cn{flex:1;min-width:0}
.crow button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ac);border-radius:8px;padding:5px 10px;font-size:13px}
dialog hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.cst{font-size:12px;color:var(--sub);min-height:1em}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.danger{color:var(--ac)}
.ic.star.won{color:var(--dis)}
.visits{display:flex;flex-wrap:wrap;gap:6px}
.visits:empty{display:none}
.vchip{font-size:13px;background:var(--ok2);color:var(--ok);border-radius:999px;padding:3px 6px 3px 10px;display:inline-flex;gap:4px;align-items:center}
.vchip button{border:0;background:none;color:inherit;font-size:13px;padding:0 4px;cursor:pointer}
.vadd{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;margin-left:6px}
.sensel{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:5px 10px;font-size:13px}
.tmap{position:relative;width:100%;aspect-ratio:1/1;max-width:520px;margin:0 auto}
.tile{position:absolute;width:calc(100%/12 - 2px);aspect-ratio:1/1;border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;color:var(--tx);cursor:pointer}
.tile .tn2{font-size:9px;line-height:1.15;font-weight:700}
.tile .tp{font-size:8px;color:var(--sub);line-height:1.15}
.tl-row{display:flex;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:15px;cursor:pointer;align-items:baseline}
.tl-d{flex:0 0 5.4em;color:var(--sub);font-size:13px}
.p-line .v2{margin-left:auto;font-weight:700;white-space:nowrap}
.sum-h{font-weight:700;margin:10px 0 4px;font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🗾 旅ログ</h1>
    <div class="total"><b id="tn">0</b> / <span id="tt">0</span></div>
    <button class="menu" id="addBtn" aria-label="スポットを追加">＋</button>
    <button class="menu" id="menuBtn" aria-label="メニュー">⚙</button>
  </div>
  <div class="gbar"><i id="gb"></i></div>
  <nav class="tabs">
    <button class="tab" data-tab="pref">都道府県別</button>
    <button class="tab" data-tab="genre">ジャンル別</button>
    <button class="tab" data-tab="sandai">日本三大○○</button>
    <button class="tab" data-tab="kiroku">記録</button>
    <button class="tab" data-tab="prog">進捗</button>
  </nav>
</header>
<main>
  <div id="warn" hidden>⚠ この環境ではデータを保存できません。メニューから書き出してバックアップしてください。</div>
  <div id="bar" class="bar-f"></div>
  <div id="app"></div>
</main>

<dialog id="dlg">
  <h3>データ管理</h3>
  <p>記録はこの端末のブラウザ内に保存されます。下のクラウド同期を設定すると、ご自身のGoogleドライブにも自動で保存されます。</p>
  <button class="btn pri" id="exp">📤 書き出す（JSON）</button>
  <button class="btn" id="imp">📥 読み込む</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
  <hr>
  <h3>☁ クラウド同期</h3>
  <p>GASのURLと合言葉を設定すると、開いたときに自動で読み込み、変更すると自動で保存します。</p>
  <input type="url" id="curl" placeholder="GASのURL（https://script.google.com/…）" autocomplete="off">
  <input type="password" id="ckey" placeholder="合言葉" autocomplete="off">
  <button class="btn" id="csave">同期を設定する</button>
  <p id="cst" class="cst"></p>
  <hr>
  <h3>✏️ スポットを追加</h3>
  <p>ご自身でスポットを追加できます。追加したスポットはクラウド同期で他の端末にも反映されます。</p>
  <input type="text" id="aname" placeholder="スポット名（例：○○温泉）" autocomplete="off">
  <select id="apref"></select>
  <select id="agenre"></select>
  <button class="btn" id="aadd">追加する</button>
  <div id="alist"></div>
  <hr>
  <button class="btn danger" id="rst">🗑 すべての記録を消す</button>
  <button class="btn" id="cls">閉じる</button>
</dialog>

function seasonMatch(sp){const m=new Date().getMonth();const si=m>=2&&m<=4?0:m>=5&&m<=7?1:m>=8&&m<=10?2:3;return SEASON_KW[si].some(k=>sp.name.includes(k))}
function matches(sp){
  if(V.unv&&isOn(sp.id))return false;
  if(V.want&&!(S.rec[sp.id]&&S.rec[sp.id].w))return false;
  if(V.g&&sp.g!==V.g)return false;
  if(V.sen&&SENSEN[sp.id]!==V.sen)return false;
  if(V.seas&&!seasonMatch(sp))return false;
  if(V.near&&!V.near.includes(sp.pref))return false;
  if(V.q){const q=V.q.toLowerCase();const rec=S.rec[sp.id];const hay=(sp.name+sp.pref+sp.sandai.map(t=>t.title).join('')+((rec&&rec.m)||'')).toLowerCase();if(!hay.includes(q))return false}
  return true;
}

function cardHead(name,key,attr){

function renderPref(){
  const filtering=V.q||V.unv||V.g||V.want||V.sen||V.seas||V.near;let h='';
  for(const [rg,list] of REGIONS){
    let inner='';
    for(const p of list){
      const all=BYPREF[p]||[];const vis=all.filter(matches);
      if(filtering&&!vis.length)continue;
      const key='p:'+p;
      if(V.q&&vis.length)OPEN.add(key);
      inner+=cardHead(p,key,`data-pref="${p}"`);
      if(!all.length)inner+='<p class="empty">スポットはまだ登録されていません</p>';
      else{
        for(const gk in GENRES){
          const items=vis.filter(s=>s.g===gk);
          if(items.length)inner+=`<div class="gh">${GENRES[gk].i} ${GENRES[gk].n}</div>`+items.map(s=>rowHTML(s,'pref')).join('');
        }
        if(!FULL.has(p))inner+='<p class="note">※ 日本三大○○のスポットのみ登録済み。他のスポットは順次追加します。</p>';
      }
      inner+='</div></section>';
    }
    if(inner)h+=`<h2 class="rg">${rg}</h2>`+inner;
  }
  $('#app').innerHTML=h||'<p class="empty">該当するスポットがありません</p>';
}
function renderSandai(){
  let h='';
  for(const c of SANDAI){
    const def=c.items.filter(i=>!i[1]),dis=c.items.filter(i=>i[1]);
    const fd=def.filter(([id])=>matches(SP[id])),fs=dis.filter(([id])=>matches(SP[id]));
    if((V.q||V.unv)&&!fd.length&&!fs.length)continue;
    const key='c:'+c.id;if(V.q&&(fd.length||fs.length))OPEN.add(key);
    h+=cardHead('🏆 '+c.title,key,`data-cat="${c.id}"`);
    if(c.note)h+=`<div class="sandai-note">※ ${esc(c.note)}</div>`;
    h+=fd.map(([id])=>rowHTML(SP[id],'sandai',false)).join('');
    if(fs.length)h+='<div class="sep">─ 諸説あり ─</div>'+fs.map(([id])=>rowHTML(SP[id],'sandai',true)).join('');
    h+='</div></section>';
  }
  $('#app').innerHTML=h||'<p class="empty">該当するものがありません</p>';
}
function renderGenre(){
  let h='';

    const all=Object.values(SP).filter(s=>s.g===gk);
    const vis=all.filter(matches);
    if((V.q||V.unv||V.want)&&!vis.length)continue;
    const key='g:'+gk;if(V.q&&vis.length)OPEN.add(key);
    h+=cardHead(GENRES[gk].i+' '+GENRES[gk].n,key,`data-genre="${gk}"`);
    h+=vis.map(s=>rowHTML(s,'genre')).join('');

}
function renderKiroku(){
  const entries=[];
  for(const id in S.rec){const sp=SP[id];if(!sp)continue;visitsOf(id).forEach(d=>entries.push({d,sp}))}
  entries.sort((a,b)=>b.d.localeCompare(a.d));
  if(!entries.length){$('#app').innerHTML='<p class="empty">訪問日つきの記録はまだありません。スポットのメモ欄（✎）から訪問日を追加できます。</p>';return}
  let h='',ym='';
  const WD=['日','月','火','水','木','金','土'];
  for(const e of entries){
    const k=e.d.slice(0,7);
    if(k!==ym){ym=k;h+=`<h2 class="rg">${e.d.slice(0,4)}年${+e.d.slice(5,7)}月</h2>`}
    const wd=WD[new Date(e.d+'T00:00:00').getDay()];
    h+=`<div class="tl-row" data-jump="${e.sp.id}"><span class="tl-d">${+e.d.slice(8)}日（${wd}）</span><span>${esc(e.sp.name)}<span class="pf">（${esc(e.sp.pref)}）</span></span></div>`;
  }
  const undated=Object.keys(S.rec).filter(id=>S.rec[id].c&&!visitsOf(id).length).length;
  if(undated)h+=`<p class="note">日付のないチェックが ${undated} 件あります</p>`;
  $('#app').innerHTML=h;
}

    h+=`<button class="chip${V.seas?' on':''}" data-f="seas">🌸 季節のおすすめ</button>`;
    h+=`<button class="chip${V.near?' on':''}" data-f="near">📍 近くの県</button>`;
    h+=`<select id="sen" class="sensel"><option value="">♨ 泉質すべて</option>${[...new Set(Object.values(SENSEN))].sort().map(q=>`<option value="${esc(q)}"${V.sen===q?' selected':''}>${esc(q)}</option>`).join('')}</select>`;
  }
  if(t==='sandai')h+=`<button class="chip${S.set.incl?' on':''}" data-f="incl">諸説も含めて数える</button>`;
  b.innerHTML=h;
}
function renderList(){
  const t=S.set.tab;
  if(t==='pref')renderPref();else if(t==='genre')renderGenre();else if(t==='sandai')renderSandai();else if(t==='kiroku')renderKiroku();else renderProg();
  refreshAll();
}
function setCnt(c,n,t){
  c.querySelector('.cnt').textContent=(t&&n===t&&c.dataset.cat?'🏆 ':'')+n+'/'+t;
  c.querySelector('.bar i').style.width=(t?n/t*100:0)+'%';
  c.classList.toggle('done',t>0&&n===t);
}
function refreshAll(){
  document.querySelectorAll('.row').forEach(r=>{
    const rec=S.rec[r.dataset.id]||{};
    r.classList.toggle('on',!!rec.c);
    const vs=visitsOf(r.dataset.id);
    const sub=[];if(vs.length)sub.push('📅 '+vs[vs.length-1].replace(/-/g,'/')+(vs.length>1?`（全${vs.length}回）`:''));if(rec.m)sub.push('📝 '+rec.m.split('\n')[0]);
    const el=r.querySelector('.sub');el.textContent=sub.join('　');el.hidden=!sub.length;
    const star=r.querySelector('.star');
    if(star){star.textContent=rec.w?'★':'☆';star.classList.toggle('won',!!rec.w)}
    const ve=r.querySelector('.visits');
    if(ve){const vh=vs.map((d,i)=>`<span class="vchip">📅 ${d.replace(/-/g,'/')}<button data-act="vdel" data-i="${i}" aria-label="この日を削除">✕</button></span>`).join('');if(ve._h!==vh){ve.innerHTML=vh;ve._h=vh}}
    const mi=r.querySelector('[data-f=m]');
    if(mi&&document.activeElement!==mi&&mi.value!==(rec.m||''))mi.value=rec.m||'';
  });
  document.querySelectorAll('[data-pref]').forEach(c=>{const all=BYPREF[c.dataset.pref]||[];setCnt(c,all.filter(s=>isOn(s.id)).length,all.length)});
  document.querySelectorAll('[data-genre]').forEach(c=>{const all=Object.values(SP).filter(s=>s.g===c.dataset.genre);setCnt(c,all.filter(s=>isOn(s.id)).length,all.length)});
  document.querySelectorAll('[data-cat]').forEach(c=>{const s=catStat(CAT[c.dataset.cat]);setCnt(c,s.n,s.t)});
  const ALLS=Object.values(SP);const n=ALLS.filter(s=>isOn(s.id)).length;
  $('#tn').textContent=n;$('#tt').textContent=ALLS.length;$('#gb').style.width=(ALLS.length?n/ALLS.length*100:0)+'%';
}
function setTab(t){
  S.set.tab=t;save();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  renderBar();renderList();window.scrollTo(0,0);
}

// ---------- イベント ----------
$('#app').addEventListener('click',e=>{
  const jp=e.target.closest('[data-jumppref]');
  if(jp){OPEN.add('p:'+jp.dataset.jumppref);setTab('pref');const el=document.querySelector(`[data-pref="${jp.dataset.jumppref}"]`);if(el)el.scrollIntoView({block:'start'});return}
  const j=e.target.closest('[data-jump]');
  if(j){const sp=SP[j.dataset.jump];if(sp){V.q=sp.name;setTab('pref')}return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='chk')toggle(a.closest('.row').dataset.id);
  else if(act==='star'){const id=a.closest('.row').dataset.id;const r=S.rec[id]||(S.rec[id]={});r.w=!r.w;clean(id);save();refreshAll()}
  else if(act==='vadd'){
    const row=a.closest('.row'),inp=row.querySelector('.vdate');
    if(!inp.value){alert('日付を選んでください');return}
    const id=row.dataset.id,vs=visitsOf(id);
    if(vs.includes(inp.value)){alert('その日はすでに登録されています');return}
    setVisits(id,[...vs,inp.value]);inp.value='';
  }
  else if(act==='vdel'){const row=a.closest('.row');const vs=visitsOf(row.dataset.id);vs.splice(+a.dataset.i,1);setVisits(row.dataset.id,vs)}
  else if(act==='memo'){
    const r=a.closest('.row'),m=r.querySelector('.memo'),k='m:'+r.dataset.id;
    m.hidden=!m.hidden;m.hidden?OPEN.delete(k):OPEN.add(k);
  }else if(act==='tog'){
    const c=a.closest('.card');c.classList.toggle('open');
    c.classList.contains('open')?OPEN.add(c.dataset.key):OPEN.delete(c.dataset.key);
  }
});
$('#app').addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  const id=e.target.closest('.row').dataset.id;
  const r=S.rec[id]||(S.rec[id]={});r[f]=e.target.value;clean(id);save();refreshAll();
});
$('#bar').addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value.trim();renderList()}});
$('#bar').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  if(c.dataset.g!==undefined){V.g=V.g===c.dataset.g?'':c.dataset.g}
  else if(c.dataset.f==='unv'){V.unv=!V.unv}
  else if(c.dataset.f==='want'){V.want=!V.want}
  else if(c.dataset.f==='seas'){V.seas=!V.seas}
  else if(c.dataset.f==='incl'){S.set.incl=!S.set.incl;save()}
  else if(c.dataset.f==='near'){
    if(V.near){V.near=null;renderBar();renderList();return}
    if(!navigator.geolocation){alert('この端末では位置情報を利用できません');return}
    c.textContent='📍 取得中…';
    navigator.geolocation.getCurrentPosition(pos=>{
      const la=pos.coords.latitude,lo=pos.coords.longitude;
      const ds=REGIONS.flatMap(r=>r[1]).map(p=>{const cc=CENT[p];const dx=(cc[1]-lo)*Math.cos(la*Math.PI/180),dy=cc[0]-la;return{p,d:dx*dx+dy*dy}}).sort((a,b)=>a.d-b.d);
      V.near=ds.slice(0,3).map(x=>x.p);renderBar();renderList();
    },()=>{alert('位置情報を取得できませんでした');renderBar()},{timeout:10000});
    return;
  }
  renderBar();renderList();
});
$('#bar').addEventListener('change',e=>{if(e.target.id==='sen'){V.sen=e.target.value;renderList()}});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

// ---------- データ管理 ----------
const dlg=$('#dlg');
$('#menuBtn').onclick=()=>dlg.showModal();
$('#cls').onclick=()=>dlg.close();
$('#exp').onclick=()=>{
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const blob=new Blob([JSON.stringify({app:'tabiroku',v:1,exported:d.toISOString(),rec:S.rec,custom:(S.set&&S.set.custom)||[]},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`tabiroku-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);
      if(!j||typeof j.rec!=='object')throw 0;
      if(!confirm('現在の記録を、読み込んだデータで置き換えます。よろしいですか？'))return;
      S.rec=j.rec;if(Array.isArray(j.custom))S.set.custom=j.custom;save();location.reload();
    }catch(err){alert('読み込めませんでした。書き出したJSONファイルを選んでください。')}
  };
  rd.readAsText(f);e.target.value='';
};
$('#rst').onclick=()=>{
  if(confirm('すべてのチェック・メモ・訪問日を消します。元に戻せません。')&&confirm('本当に消しますか？（先に書き出しておくのがおすすめです）')){
    S.rec={};save();dlg.close();renderList();
  }
};

// ---------- スポット追加 ----------
$('#apref').innerHTML=REGIONS.flatMap(r=>r[1]).map(p=>`<option value="${p}">${p}</option>`).join('');
$('#agenre').innerHTML=Object.keys(GENRES).map(k=>`<option value="${k}">${GENRES[k].i} ${GENRES[k].n}</option>`).join('');
function renderCustomList(){
  const list=(S.set&&S.set.custom)||[];
  $('#alist').innerHTML=list.length?list.map(c=>`<div class="crow"><span class="cn">${esc(c.name)}<span class="pf">（${esc(c.pref)}）</span></span><button data-del="${esc(c.id)}">削除</button></div>`).join(''):'';
}
$('#aadd').onclick=()=>{
  const name=$('#aname').value.trim();
  if(!name){alert('スポット名を入力してください');return}
  const pref=$('#apref').value,g=$('#agenre').value;
  const id='u-'+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36);
  (S.set.custom=S.set.custom||[]).push({id,pref,g,name});
  mergeCustom();save();$('#aname').value='';
  renderCustomList();renderList();
};
$('#alist').addEventListener('click',e=>{
  const b=e.target.closest('[data-del]');if(!b)return;
  const id=b.dataset.del;const sp=SP[id];
  if(!confirm('「'+(sp?sp.name:id)+'」を削除しますか？チェックやメモも消えます。'))return;
  S.set.custom=(S.set.custom||[]).filter(c=>c.id!==id);
  if(sp){const arr=BYPREF[sp.pref]||[];const i=arr.indexOf(sp);if(i>=0)arr.splice(i,1);delete SP[id]}
  delete S.rec[id];
  save();renderCustomList();renderList();
});

// ---------- クラウド同期 ----------
const CKEY='tabiroku.cloud';
const DEFAULT_ENDPOINT='https://script.google.com/macros/s/AKfycbzJFkZVS7VhQIMILgKmF2aQ5AqRu19CX8HJq8iJKySjwicfIlCMDOlyEqbfx0q__61nmg/exec';
let CLOUD={url:'',key:''};try{Object.assign(CLOUD,JSON.parse(localStorage.getItem(CKEY)||'{}'))}catch(e){}
if(!CLOUD.url)CLOUD.url=DEFAULT_ENDPOINT;
let cPushTimer=null;
function cloudOn(){return !!(CLOUD.url&&CLOUD.key)}
function setCst(t){const el=$('#cst');if(el)el.textContent=t}
function cloudRead(cb){
  const name='tkcb'+Date.now();const sc=document.createElement('script');
  const to=setTimeout(()=>{cleanup();cb(null)},9000);
  function cleanup(){try{delete window[name]}catch(e){}sc.remove()}
  window[name]=d=>{clearTimeout(to);cleanup();cb(d)};
  sc.onerror=()=>{clearTimeout(to);cleanup();cb(null)};
  sc.src=CLOUD.url+(CLOUD.url.includes('?')?'&':'?')+'key='+encodeURIComponent(CLOUD.key)+'&callback='+name;
  document.body.appendChild(sc);
}
function cloudPush(){
  if(!cloudOn())return;
  clearTimeout(cPushTimer);
  cPushTimer=setTimeout(()=>{
    setCst('☁ 同期中…');
    fetch(CLOUD.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:CLOUD.key,ts:META.ts,rec:S.rec,set:S.set})})
      .then(()=>setCst('☁ 同期しました（'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'）'))
      .catch(()=>setCst('⚠ 同期に失敗しました。次に開いたとき再試行します'));
  },1200);
}
function cloudSync(){
  if(!cloudOn())return;
  setCst('☁ 読み込み中…');
  cloudRead(d=>{
    if(!d||!d.ok){setCst('⚠ クラウドに接続できませんでした');return}
    if(!META.synced){
      // この端末・表示方法では初めての同期：クラウド側に記録があれば、端末側の状態で上書きせず必ず読み込む
      if(d.ts>0){
        S={rec:d.rec||{},set:Object.assign({incl:false,tab:'pref'},d.set||{})};
        lastRecStr=stateStr();META.ts=d.ts;META.synced=true;
        try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(METAKEY,JSON.stringify(META))}catch(e){}
        mergeCustom();renderList();setCst('☁ クラウドから読み込みました');
      }else{
        META.synced=true;try{localStorage.setItem(METAKEY,JSON.stringify(META))}catch(e){}
        cloudPush();
      }
      return;
    }
    if(d.ts>META.ts){
      S={rec:d.rec||{},set:Object.assign({incl:false,tab:'pref'},d.set||{})};
      lastRecStr=stateStr();META.ts=d.ts;
      try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(METAKEY,JSON.stringify(META))}catch(e){}
      mergeCustom();renderList();setCst('☁ クラウドから読み込みました');
    }else if(META.ts>d.ts){cloudPush()}
    else setCst('☁ 同期済みです');
  });
}
function prepDlg(){$('#curl').value=CLOUD.url;$('#ckey').value=CLOUD.key;renderCustomList();if(cloudOn())setCst('☁ 同期は有効です')}
$('#menuBtn').addEventListener('click',prepDlg);
$('#addBtn').onclick=()=>{prepDlg();dlg.showModal();setTimeout(()=>{const a=$('#aname');a.scrollIntoView({block:'center'});a.focus({preventScroll:true})},60)};
$('#csave').onclick=()=>{
  CLOUD.url=$('#curl').value.trim();CLOUD.key=$('#ckey').value.trim();
  try{localStorage.setItem(CKEY,JSON.stringify(CLOUD))}catch(e){}
  if(cloudOn()){setCst('☁ 設定しました。同期します…');cloudSync()}
  else setCst('同期をオフにしました');
};

setTab(['pref','genre','sandai','kiroku','prog'].includes(S.set.tab)?S.set.tab:'pref');
cloudSync();
</script>
