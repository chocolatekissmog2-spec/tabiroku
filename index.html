<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅ログ｜日本めぐりチェック</title>
<style>
:root{
  --bg:#faf7f2;--card:#fff;--tx:#2b2a28;--sub:#7a746b;--line:#e8e1d6;
  --ac:#c8453b;--ac2:#fbe9e6;--ok:#2f8f5b;--ok2:#e5f4ec;--dis:#b9852a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1b19;--card:#262522;--tx:#efece6;--sub:#a39d92;--line:#3a3834;--ac:#e8685d;--ac2:#3a2522;--ok:#4bbf80;--ok2:#1f3328;--dis:#e0b155}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 0;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:18px;margin:0;flex:1}
.total{font-size:13px;color:var(--sub)}
.total b{color:var(--ac);font-size:16px}
.menu{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;width:38px;height:38px;font-size:18px}
.gbar{height:5px;background:var(--line);border-radius:3px;margin:8px 0 0;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;border:0;background:none;color:var(--sub);padding:10px 4px;font-size:14px;font-weight:600;border-bottom:3px solid transparent}
.tab.on{color:var(--ac);border-color:var(--ac)}
main{max-width:720px;margin:0 auto;padding:0 12px 80px}
.bar-f{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}
.bar-f input[type=search]{flex:1 1 100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
h2.rg{font-size:13px;color:var(--sub);margin:18px 4px 6px;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.card.done{border-color:var(--ok)}
.hd{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--tx);padding:13px 14px;font-size:16px;text-align:left}
.hd .pn{font-weight:700;flex:0 1 auto}
.hd .cnt{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.card.done .cnt{color:var(--ok);font-weight:700}
.hd .bar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;min-width:30px}
.hd .bar i{display:block;height:100%;background:var(--ok);width:0}
.hd .car{color:var(--sub);transition:transform .2s}
.card.open .car{transform:rotate(180deg)}
.bd{display:none;padding:0 6px 10px;border-top:1px solid var(--line)}
.card.open .bd{display:block}
.gh{font-size:13px;color:var(--sub);margin:12px 8px 2px;font-weight:600}
.empty,.note{font-size:13px;color:var(--sub);margin:10px 8px}
.row{display:flex;flex-wrap:wrap;align-items:center;padding:2px 4px;border-radius:10px}
.row .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:9px 6px;cursor:pointer}
.chk{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;background:var(--card);transition:.15s}
.row.on .chk{background:var(--ok);border-color:var(--ok)}
.row.on .chk::after{content:"✓";color:#fff;font-weight:800;font-size:17px;line-height:1}
.row.on .nm{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--line)}
.tx{min-width:0}
.nm{font-size:16px}
.pf{font-size:13px;color:var(--sub);margin-left:2px;text-decoration:none;display:inline-block}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tags:empty{display:none}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;background:var(--ac2);color:var(--ac)}
.tag.pl{background:var(--line);color:var(--sub)}
.tag.dis{background:none;border:1px dashed var(--dis);color:var(--dis)}
.row.dis .chk{border-style:dashed;border-color:var(--dis)}
.row.dis.on .chk{border-style:solid;background:var(--dis);border-color:var(--dis)}
.sub{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.ic{flex:none;width:38px;height:38px;display:grid;place-items:center;border:0;background:none;color:var(--sub);font-size:17px;text-decoration:none;border-radius:10px}
.ic:active{background:var(--line)}
.memo{flex:1 1 100%;padding:2px 8px 10px 52px;display:flex;flex-direction:column;gap:6px}
.memo[hidden]{display:none}
.memo label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:8px}
.memo input,.memo textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--tx)}
.memo textarea{width:100%;resize:vertical}
.sep{font-size:12px;color:var(--dis);margin:10px 10px 2px}
.sandai-note{font-size:12px;color:var(--sub);margin:8px 12px 0}
.p-sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.p-sec h3{margin:0 0 10px;font-size:14px}
.p-line{display:flex;align-items:center;gap:10px;font-size:14px;margin:7px 0}
.p-line .l{flex:0 0 7.5em}
.p-line .b{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.p-line .b i{display:block;height:100%;background:var(--ok)}
.p-line .v{flex:0 0 3.6em;text-align:right;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.big{font-size:34px;font-weight:800;color:var(--ac)}
#warn{background:#fff3cd;color:#664d03;font-size:13px;padding:8px 12px;border-radius:10px;margin-top:10px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);width:min(92vw,400px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 6px}
dialog p{font-size:13px;color:var(--sub);margin:4px 0 12px}
.btn{display:block;width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.danger{color:var(--ac)}
</style>
</head>

<header>
  <div class="top">
    <h1>🗾 旅ログ</h1>
    <div class="total"><b id="tn">0</b> / <span id="tt">0</span></div>
    <button class="menu" id="menuBtn" aria-label="メニュー">⚙</button>
  </div>
  <div class="gbar"><i id="gb"></i></div>
  <nav class="tabs">
    <button class="tab" data-tab="pref">都道府県別</button>
    <button class="tab" data-tab="sandai">日本三大○○</button>
    <button class="tab" data-tab="prog">進捗</button>
  </nav>
</header>
<main>
  <div id="warn" hidden>⚠ この環境ではデータを保存できません。メニューから書き出してバックアップしてください。</div>
  <div id="bar" class="bar-f"></div>
  <div id="app"></div>
</main>

<dialog id="dlg">
  <h3>データ管理</h3>
  <p>記録はこの端末のブラウザ内に保存されます。キャッシュ削除や機種変更に備えて、ときどき書き出してください。</p>
  <button class="btn pri" id="exp">📤 書き出す（JSON）</button>
  <button class="btn" id="imp">📥 読み込む</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
  <button class="btn danger" id="rst">🗑 すべての記録を消す</button>
  <button class="btn" id="cls">閉じる</button>
</dialog>

// 日本三大○○。items: [スポットID, 諸説なら1]
const SANDAI=[
{id:'meijo',title:'日本三大名城',items:[['os-castle'],['ai-nagoya'],['km-castle'],['hy-himeji',1]],note:'姫路城を入れる説もあります'},
{id:'meien',title:'日本三大名園',items:[['is-kenroku'],['ok-koraku'],['ib-kairaku']]},
{id:'yakei',title:'日本三大夜景',items:[['hk-hakodate'],['hy-rokko'],['ng-inasa'],['fk-sarakura',1]],note:'皿倉山は「新日本三大夜景」とされることも'},
{id:'keikoku',title:'日本三大渓谷',items:[['nt-kiyotsu'],['tym-kurobe'],['me-osugi'],['kg-kankakei',1]]},
{id:'kyuryu',title:'日本三大急流',items:[['yg-mogami'],['km-kuma'],['sz-fujigawa']]},
{id:'baku',title:'日本三大名瀑',items:[['tc-kegon'],['wk-nachi'],['ib-fukuroda'],['tym-shomyo',1]]},
{id:'sankei',title:'日本三景',items:[['mg-matsushima'],['ky-amanohashidate'],['hs-miyajima']]},
{id:'yama',title:'日本三大霊山（三名山）',items:[['sz-fuji'],['is-hakusan'],['tym-tateyama']]},
{id:'mizuumi',title:'日本三大湖',items:[['sh-biwa'],['ib-kasumi'],['hk-saroma']],note:'面積順の三大湖'},
{id:'sakura',title:'日本三大桜',items:[['ym-jindai'],['gf-usuzumi'],['fs-miharu']]},
{id:'meisen',title:'日本三大名泉',items:[['hy-arima'],['gm-kusatsu'],['gf-gero']]},
{id:'kotou',title:'日本三古湯',items:[['ehm-dogo'],['hy-arima'],['wk-shirahama']]},
{id:'bijin',title:'日本三大美人の湯',items:[['wk-ryujin'],['sm-yunokawa'],['gm-kawanaka'],['sg-ureshino',1]]},
{id:'matsuri',title:'日本三大祭',items:[['ky-gion-matsuri'],['os-tenjin'],['tk-kanda'],['tk-sanno',1]],note:'神田祭と山王祭で諸説あり'},
{id:'hanabi',title:'日本三大花火',items:[['ak-omagari'],['nt-nagaoka'],['ib-tsuchiura']]},
{id:'bon',title:'日本三大盆踊り',items:[['ak-nishimonai'],['gf-gujo'],['tks-awa']]},
{id:'inari',title:'日本三大稲荷',items:[['ky-fushimi'],['ai-toyokawa'],['sg-yutoku'],['ib-kasama',1],['ok-mogami-inari',1]],note:'祐徳稲荷の代わりに笠間・最上稲荷を入れる説あり'},
{id:'daibutsu',title:'日本三大大仏',items:[['nr-todaiji'],['kn-kamakura'],['tym-takaoka'],['nr-asuka',1],['hy-nofukuji',1]]},
{id:'wagyu',title:'日本三大和牛',items:[['hy-kobe-beef'],['me-matsusaka'],['sh-omi'],['yg-yonezawa',1]]},
{id:'udon',title:'日本三大うどん',items:[['kg-sanuki'],['ak-inaniwa'],['ng-goto-udon'],['gm-mizusawa',1],['tym-himi',1]]},
{id:'soba',title:'日本三大そば',items:[['sm-izumo-soba'],['iw-wanko'],['nn-togakushi']]},
{id:'ramen',title:'日本三大ラーメン',items:[['hk-sapporo-ramen'],['fk-hakata-ramen'],['fs-kitakata'],['hk-asahikawa-ramen',1],['wk-ramen',1]]},
{id:'gakkari',title:'日本三大がっかり名所',items:[['hk-tokeidai'],['ks-harimaya'],['okn-shureimon'],['ng-oranda',1]],note:'ネタ枠。守礼門とオランダ坂で諸説あり'}
];
/*ENDDATA*/

// ---------- 初期化 ----------
const SP={},BYPREF={},CAT={};
SPOTS.forEach(a=>{const s={id:a[0],pref:a[1],g:a[2],name:a[3],sandai:[]};SP[s.id]=s;(BYPREF[s.pref]=BYPREF[s.pref]||[]).push(s)});
SANDAI.forEach(c=>{CAT[c.id]=c;c.items.forEach(([id,d])=>{if(SP[id])SP[id].sandai.push({cid:c.id,title:c.title,d:!!d});else console.warn('unknown id',id)})});

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='tabiroku.v1';
let S={rec:{},set:{incl:false,tab:'pref'}};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.rec)S={rec:r.rec,set:Object.assign({incl:false,tab:'pref'},r.set||{})}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){$('#warn').hidden=false}}
const V={q:'',unv:false,g:''};
const OPEN=new Set();
SANDAI.forEach(c=>OPEN.add('c:'+c.id)); // 三大○○は最初から開いた状態
const isOn=id=>!!(S.rec[id]&&S.rec[id].c);
function clean(id){const r=S.rec[id];if(r&&!r.c&&!r.d&&!r.m)delete S.rec[id]}
function toggle(id){const r=S.rec[id]||(S.rec[id]={});r.c=!r.c;clean(id);save();refreshAll();if(navigator.vibrate)navigator.vibrate(8)}

// ---------- 描画 ----------
function matches(sp){
  if(V.unv&&isOn(sp.id))return false;
  if(V.g&&sp.g!==V.g)return false;
  if(V.q){const q=V.q.toLowerCase();const hay=(sp.name+sp.pref+sp.sandai.map(t=>t.title).join('')).toLowerCase();if(!hay.includes(q))return false}
  return true;
}
function rowHTML(sp,ctx,dis){
  const g=GENRES[sp.g];let tags='';
  if(ctx==='pref'){
    tags=sp.sandai.map(t=>`<span class="tag${t.d?' dis':''}">${esc(t.title.replace(/^日本/,''))}${t.d?'（諸説）':''}</span>`).join('');
  }else{
    tags=(dis?'<span class="tag dis">諸説あり</span>':'')+`<span class="tag pl">${g.i}${g.n}</span>`;
  }
  const q=encodeURIComponent(sp.name.replace(/（.*?）/g,'')+' '+sp.pref);
  const open=OPEN.has('m:'+sp.id);
  return `<div class="row${dis?' dis':''}" data-id="${sp.id}">
<div class="main" data-act="chk"><span class="chk"></span><div class="tx"><div class="nm">${esc(sp.name)}${ctx==='sandai'?`<span class="pf">（${esc(sp.pref)}）</span>`:''}</div><div class="tags">${tags}</div><div class="sub" hidden></div></div></div>
<a class="ic" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener" aria-label="地図">📍</a>
<button class="ic" data-act="memo" aria-label="メモ">✎</button>
<div class="memo"${open?'':' hidden'}>
<label>訪問日 <input type="date" data-f="d"></label>
<textarea data-f="m" rows="2" placeholder="メモ（感想・おすすめ・次回やりたいこと）"></textarea>
</div></div>`;
}
function cardHead(name,key,attr){
  return `<section class="card${OPEN.has(key)?' open':''}" data-key="${key}" ${attr}><button class="hd" data-act="tog"><span class="pn">${esc(name)}</span><span class="cnt"></span><span class="bar"><i></i></span><span class="car">▾</span></button><div class="bd">`;
}
function renderPref(){
  const filtering=V.q||V.unv||V.g;let h='';
  for(const [rg,list] of REGIONS){
    let inner='';
    for(const p of list){
      const all=BYPREF[p]||[];const vis=all.filter(matches);
      if(filtering&&!vis.length)continue;
      const key='p:'+p;
      if(V.q&&vis.length)OPEN.add(key);
      inner+=cardHead(p,key,`data-pref="${p}"`);
      if(!all.length)inner+='<p class="empty">スポットはまだ登録されていません</p>';
      else{
        for(const gk in GENRES){
          const items=vis.filter(s=>s.g===gk);
          if(items.length)inner+=`<div class="gh">${GENRES[gk].i} ${GENRES[gk].n}</div>`+items.map(s=>rowHTML(s,'pref')).join('');
        }
        if(!FULL.has(p))inner+='<p class="note">※ 日本三大○○のスポットのみ登録済み。他のスポットは順次追加します。</p>';
      }
      inner+='</div></section>';
    }
    if(inner)h+=`<h2 class="rg">${rg}</h2>`+inner;
  }
  $('#app').innerHTML=h||'<p class="empty">該当するスポットがありません</p>';
}
function renderSandai(){
  let h='';
  for(const c of SANDAI){
    const def=c.items.filter(i=>!i[1]),dis=c.items.filter(i=>i[1]);
    const fd=def.filter(([id])=>matches(SP[id])),fs=dis.filter(([id])=>matches(SP[id]));
    if((V.q||V.unv)&&!fd.length&&!fs.length)continue;
    const key='c:'+c.id;if(V.q&&(fd.length||fs.length))OPEN.add(key);
    h+=cardHead('🏆 '+c.title,key,`data-cat="${c.id}"`);
    if(c.note)h+=`<div class="sandai-note">※ ${esc(c.note)}</div>`;
    h+=fd.map(([id])=>rowHTML(SP[id],'sandai',false)).join('');
    if(fs.length)h+='<div class="sep">─ 諸説あり ─</div>'+fs.map(([id])=>rowHTML(SP[id],'sandai',true)).join('');
    h+='</div></section>';
  }
  $('#app').innerHTML=h||'<p class="empty">該当するものがありません</p>';
}
function pline(l,n,t){const p=t?Math.round(n/t*100):0;return `<div class="p-line"><span class="l">${esc(l)}</span><span class="b"><i style="width:${p}%"></i></span><span class="v">${n}/${t}</span></div>`}
function catStat(c){const items=c.items.filter(([id,d])=>S.set.incl||!d);return{n:items.filter(([id])=>isOn(id)).length,t:items.length}}
function renderProg(){
  const tot=SPOTS.length,n=SPOTS.filter(s=>isOn(s.id)).length;
  let h=`<div class="p-sec"><div class="big">${tot?Math.round(n/tot*100):0}%</div><div class="total">${n} / ${tot} 件チェック済み</div></div>`;
  const done=SANDAI.filter(c=>{const s=catStat(c);return s.n===s.t}).length;
  h+=`<div class="p-sec"><h3>🏆 三大○○の制覇　${done} / ${SANDAI.length}</h3>`+SANDAI.map(c=>{const s=catStat(c);return pline(c.title.replace(/^日本/,''),s.n,s.t)}).join('')+`<p class="note" style="margin:8px 0 0">${S.set.incl?'諸説も含めて数えています':'諸説を除いて数えています（「日本三大○○」タブで切替）'}</p></div>`;
  h+='<div class="p-sec"><h3>ジャンル別</h3>'+Object.keys(GENRES).map(k=>{const l=SPOTS.filter(s=>s.g===k);return pline(GENRES[k].i+' '+GENRES[k].n,l.filter(s=>isOn(s.id)).length,l.length)}).join('')+'</div>';
  h+='<div class="p-sec"><h3>都道府県別</h3>'+REGIONS.flatMap(r=>r[1]).filter(p=>BYPREF[p]).map(p=>{const l=BYPREF[p];return pline(p+(FULL.has(p)?'':' *'),l.filter(s=>isOn(s.id)).length,l.length)}).join('')+'<p class="note" style="margin:8px 0 0">* は三大○○のスポットのみ登録済み</p></div>';
  $('#app').innerHTML=h;
}
function renderBar(){
  const t=S.set.tab,b=$('#bar');
  if(t==='prog'){b.innerHTML='';return}
  let h=`<input type="search" id="q" placeholder="${t==='pref'?'スポット・県名・三大○○で検索':'三大○○・スポット名で検索'}" value="${esc(V.q)}">`;
  h+=`<button class="chip${V.unv?' on':''}" data-f="unv">未訪問のみ</button>`;
  if(t==='pref')h+=Object.keys(GENRES).map(k=>`<button class="chip${V.g===k?' on':''}" data-g="${k}">${GENRES[k].i}${GENRES[k].n}</button>`).join('');
  if(t==='sandai')h+=`<button class="chip${S.set.incl?' on':''}" data-f="incl">諸説も含めて数える</button>`;
  b.innerHTML=h;
}
function renderList(){
  const t=S.set.tab;
  if(t==='pref')renderPref();else if(t==='sandai')renderSandai();else renderProg();
  refreshAll();
}
function setCnt(c,n,t){
  c.querySelector('.cnt').textContent=(t&&n===t&&c.dataset.cat?'🏆 ':'')+n+'/'+t;
  c.querySelector('.bar i').style.width=(t?n/t*100:0)+'%';
  c.classList.toggle('done',t>0&&n===t);
}
function refreshAll(){
  document.querySelectorAll('.row').forEach(r=>{
    const rec=S.rec[r.dataset.id]||{};
    r.classList.toggle('on',!!rec.c);
    const sub=[];if(rec.d)sub.push('📅 '+rec.d.replace(/-/g,'/'));if(rec.m)sub.push('📝 '+rec.m.split('\n')[0]);
    const el=r.querySelector('.sub');el.textContent=sub.join('　');el.hidden=!sub.length;
    const di=r.querySelector('[data-f=d]'),mi=r.querySelector('[data-f=m]');
    if(di&&document.activeElement!==di&&di.value!==(rec.d||''))di.value=rec.d||'';
    if(mi&&document.activeElement!==mi&&mi.value!==(rec.m||''))mi.value=rec.m||'';
  });
  document.querySelectorAll('[data-pref]').forEach(c=>{const all=BYPREF[c.dataset.pref]||[];setCnt(c,all.filter(s=>isOn(s.id)).length,all.length)});
  document.querySelectorAll('[data-cat]').forEach(c=>{const s=catStat(CAT[c.dataset.cat]);setCnt(c,s.n,s.t)});
  const n=SPOTS.filter(s=>isOn(s.id)).length;
  $('#tn').textContent=n;$('#tt').textContent=SPOTS.length;$('#gb').style.width=(SPOTS.length?n/SPOTS.length*100:0)+'%';
}
function setTab(t){
  S.set.tab=t;save();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  renderBar();renderList();window.scrollTo(0,0);
}

// ---------- イベント ----------
$('#app').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='chk')toggle(a.closest('.row').dataset.id);
  else if(act==='memo'){
    const r=a.closest('.row'),m=r.querySelector('.memo'),k='m:'+r.dataset.id;
    m.hidden=!m.hidden;m.hidden?OPEN.delete(k):OPEN.add(k);
  }else if(act==='tog'){
    const c=a.closest('.card');c.classList.toggle('open');
    c.classList.contains('open')?OPEN.add(c.dataset.key):OPEN.delete(c.dataset.key);
  }
});
$('#app').addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  const id=e.target.closest('.row').dataset.id;
  const r=S.rec[id]||(S.rec[id]={});r[f]=e.target.value;clean(id);save();refreshAll();
});
$('#bar').addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value.trim();renderList()}});
$('#bar').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  if(c.dataset.g!==undefined){V.g=V.g===c.dataset.g?'':c.dataset.g}
  else if(c.dataset.f==='unv'){V.unv=!V.unv}
  else if(c.dataset.f==='incl'){S.set.incl=!S.set.incl;save()}
  renderBar();renderList();
});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

// ---------- データ管理 ----------
const dlg=$('#dlg');
$('#menuBtn').onclick=()=>dlg.showModal();
$('#cls').onclick=()=>dlg.close();
$('#exp').onclick=()=>{
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const blob=new Blob([JSON.stringify({app:'tabiroku',v:1,exported:d.toISOString(),rec:S.rec},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`tabiroku-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);
      if(!j||typeof j.rec!=='object')throw 0;
      if(!confirm('現在の記録を、読み込んだデータで置き換えます。よろしいですか？'))return;
      S.rec=j.rec;save();dlg.close();renderList();
    }catch(err){alert('読み込めませんでした。書き出したJSONファイルを選んでください。')}
  };
  rd.readAsText(f);e.target.value='';
};
$('#rst').onclick=()=>{
  if(confirm('すべてのチェック・メモ・訪問日を消します。元に戻せません。')&&confirm('本当に消しますか？（先に書き出しておくのがおすすめです）')){
    S.rec={};save();dlg.close();renderList();
  }
};

setTab(['pref','sandai','prog'].includes(S.set.tab)?S.set.tab:'pref');
</script>
</body>
</html>
